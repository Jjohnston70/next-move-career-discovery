name: Bug report (fictional examples only)
description: Report an application problem without exposing participant answers.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        **Privacy first:** Never submit real assessment responses, private
        reflections, report exports, backup files, addresses, or API keys.
        Reproduce the issue with fabricated values only.
  - type: input
    id: version
    attributes:
      label: Next Move version
      description: See the version in the app or package metadata.
      placeholder: "1.3.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
      placeholder: "Chrome on macOS"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce (fictional data only)
      description: List the steps that trigger the problem.
      placeholder: "1. Open Next-Move.html  2. Select ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: My report contains only fictional test data and no secrets or personal responses.
          required: true
